        const GAME_WIDTH = 1280;
        const GAME_HEIGHT = 720;
        const TILE_SIZE = 40;
        const FPS = 60;
        const FRAME_TIME = 1000 / FPS;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

            currentScene: 'splash',

            isPaused: false,

            totalCoins: 0,

            isMuted: false

        // ==================== ASSET GENERATORS ====================
        const AssetGenerator = {
            createGradient(x1, y1, x2, y2, stops) {
                const grad = ctx.createLinearGradient(x1, y1, x2, y2);
                stops.forEach(([offset, color]) => grad.addColorStop(offset, color));
                return grad;
            },

            createRadialGradient(x, y, r1, r2, stops) {
                const grad = ctx.createRadialGradient(x, y, r1, x, y, r2);
                stops.forEach(([offset, color]) => grad.addColorStop(offset, color));
                return grad;
            },

            drawPlayer(x, y, state = {}) {
                ctx.save();
                ctx.translate(x, y);

                // Head
                const headGrad = this.createRadialGradient(0, 0, 5, 15, [
                    [0, '#ffe4c4'],
                    [1, '#ffd99b']
                ]);
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.arc(0, -8, 12, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-5, -10, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(5, -10, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // Smile
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, -6, 4, 0, Math.PI);
                ctx.stroke();

                // Body
                const bodyGrad = this.createLinearGradient(0, -2, 0, 12, [
                    [0, '#ff69b4'],
                    [1, '#ff1493']
                ]);
                ctx.fillStyle = bodyGrad;
                ctx.fillRect(-10, -2, 20, 16);

                // Arms
                ctx.fillStyle = '#ffe4c4';
                ctx.fillRect(-16, 0, 6, 12);
                ctx.fillRect(10, 0, 6, 12);

                // Legs
                ctx.fillStyle = '#4a90e2';
                ctx.fillRect(-8, 14, 6, 12);
                ctx.fillRect(2, 14, 6, 12);

                ctx.restore();
            },

            drawEnemy(x, y, type) {
                ctx.save();
                ctx.translate(x, y);

                if (type === 'spike') {
                    ctx.fillStyle = '#ff4444';
                    ctx.beginPath();
                    ctx.moveTo(0, -15);
                    ctx.lineTo(12, 5);
                    ctx.lineTo(-12, 5);
                    ctx.closePath();
                    ctx.fill();
                } else if (type === 'bat') {
                    ctx.fillStyle = '#333333';
                    ctx.beginPath();
                    ctx.arc(0, 0, 8, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#555555';
                    ctx.beginPath();
                    ctx.arc(-6, -4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(6, -4, 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(-6, -4, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(6, -4, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            },

            drawCoin(x, y) {
                ctx.save();
                ctx.translate(x, y);
                const coinGrad = this.createRadialGradient(0, 0, 0, 8, [
                    [0, '#ffff99'],
                    [0.5, '#ffcc00'],
                    [1, '#cc9900']
                ]);
                ctx.fillStyle = coinGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(0, 0, 7, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#ffff99';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('C', 0, 1);

                ctx.restore();
            },

            drawStar(x, y) {
                ctx.save();
                ctx.translate(x, y);
                const starGrad = this.createRadialGradient(0, 0, 0, 10, [
                    [0, '#ffff99'],
                    [0.5, '#ffdd00'],
                    [1, '#ffaa00']
                ]);
                ctx.fillStyle = starGrad;
                const points = 5;
                const outerRadius = 10;
                const innerRadius = 4;

                ctx.beginPath();
                for (let i = 0; i < points * 2; i++) {
                    const radius = i % 2 === 0 ? outerRadius : innerRadius;
                    const angle = (i * Math.PI) / points - Math.PI / 2;
                    const px = Math.cos(angle) * radius;
                    const py = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#ffff66';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();
            },

            drawDoor(x, y, isOpen = false) {
                ctx.save();
                ctx.translate(x, y);

                if (!isOpen) {
                    const doorGrad = this.createLinearGradient(-15, 0, 15, 0, [
                        [0, '#8b4513'],
                        [0.5, '#a0522d'],
                        [1, '#8b4513']
                    ]);
                    ctx.fillStyle = doorGrad;
                    ctx.fillRect(-15, -25, 30, 50);

                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(12, 0, 3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(139, 69, 19, 0.3)';
                    ctx.fillRect(-15, -25, 30, 50);
                }

                ctx.restore();
            },

            drawPlatform(x, y, width, height, style = 'normal') {
                ctx.save();

                if (style === 'ice') {
                    const grad = this.createLinearGradient(x, y, x, y + height, [
                        [0, '#b3e5fc'],
                        [1, '#01579b']
                    ]);
                    ctx.fillStyle = grad;
                } else if (style === 'lava') {
                    const grad = this.createLinearGradient(x, y, x, y + height, [
                        [0, '#ff6b1a'],
                        [1, '#c41e3a']
                    ]);
                    ctx.fillStyle = grad;
                } else {
                    const grad = this.createLinearGradient(x, y, x, y + height, [
                        [0, '#2ecc71'],
                        [1, '#27ae60']
                    ]);
                    ctx.fillStyle = grad;
                }

                ctx.fillRect(x, y, width, height);
                ctx.strokeStyle = '#1e8449';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, width, height);

                ctx.restore();
            },

            drawSpike(x, y, size = 20) {
                ctx.save();
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.moveTo(x, y - size);
                ctx.lineTo(x + size / 2, y + size / 2);
                ctx.lineTo(x - size / 2, y + size / 2);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        };

        // ==================== PARTICLE SYSTEM ====================
        class Particle {
            constructor(x, y, vx, vy, color, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = life;
                this.maxLife = life;
                this.size = Math.random() * 3 + 2;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += 100 * dt; // Gravity
                this.life -= dt;
                this.size *= 0.98;
            }

            draw() {
                const alpha = this.life / this.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            isAlive() {
                return this.life > 0;
            }
        }

        class ParticleEmitter {
            constructor(x, y, count = 10, color = '#ffff00') {
                this.particles = [];
                for (let i = 0; i < count; i++) {
                    const angle = (Math.random() * Math.PI * 2);
                    const speed = Math.random() * 200 + 100;
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    this.particles.push(new Particle(x, y, vx, vy, color, 1));
                }
            }

            update(dt) {
                this.particles = this.particles.filter(p => p.isAlive());
                this.particles.forEach(p => p.update(dt));
            }

            draw() {
                this.particles.forEach(p => p.draw());
            }
        }

        // ==================== PLAYER CLASS ====================
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 20;
                this.height = 30;
                this.vx = 0;
                this.vy = 0;
                this.isJumping = false;
                this.jumpCount = 0;
                this.isDashing = false;
                this.dashCooldown = 0;
                this.health = 3;
                this.maxHealth = 3;
                this.coins = 0;
                this.stars = 0;
                this.xp = 0;
                this.level = 1;
                this.canWallJump = false;
                this.lastX = x;
                this.lastY = y;
                this.wasJumping = false;
            }

            update(dt, platforms, enemies) {
                this.lastX = this.x;
                this.lastY = this.y;

                // Horizontal movement
                let moveX = 0;
                if (keys['ArrowLeft'] || keys['a'] || touchControls.left) moveX -= 200;
                if (keys['ArrowRight'] || keys['d'] || touchControls.right) moveX += 200;

                this.vx = moveX;
                this.x += this.vx * dt;

                // Gravity
                this.vy += 500 * dt;
                this.y += this.vy * dt;

                // Platform collision
                let isGrounded = false;
                platforms.forEach(platform => {
                    if (this.checkCollision(platform)) {
                        if (this.lastY + this.height <= platform.y + 5) {
                            this.y = platform.y - this.height;
                            this.vy = 0;
                            this.isJumping = false;
                            this.jumpCount = 0;
                            isGrounded = true;
                        }
                    }
                });

                // Jump
                if ((keys[' '] || keys['w'] || keys['ArrowUp'] || touchControls.jump) && (isGrounded || this.jumpCount < 2)) {
                    if (!this.wasJumping) {
                        this.vy = -300;
                        this.isJumping = true;
                        this.jumpCount++;
                        this.wasJumping = true;
                        this.createJumpParticles();
                    }
                } else {
                    this.wasJumping = false;
                }

                // Dash
                if ((keys['Shift'] || keys['x']) && this.dashCooldown <= 0) {
                    this.isDashing = true;
                    this.dashCooldown = 0.5;
                    const dashDirection = this.vx > 0 ? 1 : (this.vx < 0 ? -1 : 1);
                    this.x += dashDirection * 100;
                    this.createDashParticles();
                }

                this.dashCooldown -= dt;

                // Enemy collision
                enemies.forEach(enemy => {
                    if (this.checkCollisionCircle(enemy)) {
                        this.takeDamage(1);
                    }
                });

                // Screen bounds
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > GAME_WIDTH) this.x = GAME_WIDTH - this.width;
                if (this.y > GAME_HEIGHT) this.health = 0;
            }

            checkCollision(platform) {
                return (
                    this.x + this.width > platform.x &&
                    this.x < platform.x + platform.width &&
                    this.y + this.height > platform.y &&
                    this.y < platform.y + platform.height
                );
            }

            checkCollisionCircle(enemy) {
                const distance = Math.hypot(
                    this.x + this.width / 2 - (enemy.x + 10),
                    this.y + this.height / 2 - (enemy.y + 10)
                );
                return distance < 20;
            }

            takeDamage(amount) {
                this.health -= amount;
                this.createDamageParticles();
            }

            createJumpParticles() {
                const emitter = new ParticleEmitter(
                    this.x + this.width / 2,
                    this.y + this.height,
                    5,
                    '#ff69b4'
                );
                particles.push(emitter);
            }

            createDashParticles() {
                const emitter = new ParticleEmitter(
                    this.x + this.width / 2,
                    this.y + this.height / 2,
                    15,
                    '#ffaa00'
                );
                particles.push(emitter);
            }

            createDamageParticles() {
                const emitter = new ParticleEmitter(
                    this.x + this.width / 2,
                    this.y + this.height / 2,
                    20,
                    '#ff0000'
                );
                particles.push(emitter);
            }

            draw() {
                AssetGenerator.drawPlayer(this.x + this.width / 2, this.y + this.height / 2);
            }
        }

        // ==================== GAME OBJECTS ====================
        class Platform {
            constructor(x, y, width, height, style = 'normal', isMoving = false, moveDistance = 0) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.style = style;
                this.isMoving = isMoving;
                this.moveDistance = moveDistance;
                this.moveDirection = 1;
                this.moveSpeed = 60;
                this.startX = x;
            }

            update(dt) {
                if (this.isMoving) {
                    this.x += this.moveSpeed * this.moveDirection * dt;
                    if (Math.abs(this.x - this.startX) > this.moveDistance) {
                        this.moveDirection *= -1;
                    }
                }
            }

            draw() {
                AssetGenerator.drawPlatform(this.x, this.y, this.width, this.height, this.style);
            }
        }

        class Enemy {
            constructor(x, y, type = 'bat', patrolDistance = 0) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.width = 16;
                this.height = 16;
                this.patrolDistance = patrolDistance;
                this.moveDirection = 1;
                this.moveSpeed = 80;
                this.startX = x;
            }

            update(dt) {
                if (this.patrolDistance > 0) {
                    this.x += this.moveSpeed * this.moveDirection * dt;
                    if (Math.abs(this.x - this.startX) > this.patrolDistance) {
                        this.moveDirection *= -1;
                    }
                }
            }

            draw() {
                AssetGenerator.drawEnemy(this.x, this.y, this.type);
            }
        }

        class Collectible {
            constructor(x, y, type = 'coin') {
                this.x = x;
                this.y = y;
                this.type = type;
                this.width = 16;
                this.height = 16;
                this.collected = false;
                this.floatOffset = 0;
                this.floatSpeed = 2;
            }

            update(dt) {
                this.floatOffset += this.floatSpeed * dt;
                if (this.floatOffset > 2 * Math.PI) {
                    this.floatOffset = 0;
                }
            }

            draw() {
                const yOffset = Math.sin(this.floatOffset) * 5;
                if (this.type === 'coin') {
                    AssetGenerator.drawCoin(this.x, this.y + yOffset);
                } else if (this.type === 'star') {
                    AssetGenerator.drawStar(this.x, this.y + yOffset);
                }
            }

            checkCollision(player) {
                return (
                    player.x + player.width > this.x &&
                    player.x < this.x + this.width &&
                    player.y + player.height > this.y &&
                    player.y < this.y + this.height
                );
            }
        }

                checkpointY: 600
            },
            {
                name: "Final Sanctuary",
                platforms: [
                    new Platform(0, 650, 1280, 70, 'normal'),
                    new Platform(150, 550, 150, 20),
                    new Platform(400, 450, 200, 20),
                    new Platform(700, 350, 200, 20),
                    new Platform(1000, 450, 150, 20),
                ],
                enemies: [
                    new Enemy(500, 400, 'bat', 150),
                    new Enemy(800, 300, 'bat', 150),
                ],
                collectibles: [
                    new Collectible(225, 520, 'star'),
                    new Collectible(500, 420, 'star'),
                    new Collectible(800, 320, 'star'),
                    new Collectible(1075, 420, 'star'),
                ],
                checkpointX: 100,
                checkpointY: 600,
                isFinalLevel: true
            }
        ];

        // ==================== GLOBAL VARIABLES ====================
        let player = null;
        let currentLevel = null;
        let particles = [];
        let keys = {};
        let touchControls = { left: false, right: false, jump: false };
        let lastFrameTime = Date.now();
        let screenShake = 0;

        // ==================== INPUT HANDLING ====================
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'p' || e.key === 'P') {
                gameState.isPaused = !gameState.isPaused;
            }
            if (e.key === 'f' || e.key === 'F') {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Touch controls
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const touchX = touch.clientX / canvas.clientWidth * GAME_WIDTH;
            const touchY = touch.clientY / canvas.clientHeight * GAME_HEIGHT;

            if (touchX < GAME_WIDTH / 3) {
                touchControls.left = true;
            } else if (touchX > (2 * GAME_WIDTH) / 3) {
                touchControls.right = true;
            }

            if (touchY > GAME_HEIGHT / 2) {
                touchControls.jump = true;
            }
        });

        canvas.addEventListener('touchend', () => {
            touchControls.left = false;
            touchControls.right = false;
            touchControls.jump = false;
        });

        // ==================== SCENE MANAGERS ====================
        function drawBackground() {
            // Sky gradient based on day/night cycle
            const dayProgress = (Math.sin(gameState.dayNightCycle) + 1) / 2;

            const skyColor1 = dayProgress > 0.5
                ? `rgb(${Math.floor(135 + dayProgress * 120)}, ${Math.floor(206 + dayProgress * 49)}, 235)`
                : `rgb(${Math.floor(25 + dayProgress * 110)}, ${Math.floor(25 + dayProgress * 85)}, ${Math.floor(50 + dayProgress * 185)})`;

            const grad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
            grad.addColorStop(0, skyColor1);
            grad.addColorStop(1, dayProgress > 0.5 ? '#e0f6ff' : '#001a4d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Stars during night
            if (dayProgress < 0.5) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                for (let i = 0; i < 50; i++) {
                    const x = (i * 73) % GAME_WIDTH;
                    const y = (i * 47) % (GAME_HEIGHT / 2);
                    ctx.fillRect(x, y, 2, 2);
                }
            }

            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            const cloudOffset = (gameState.timeElapsed * 20) % GAME_WIDTH;
            for (let i = 0; i < 5; i++) {
                const x = (i * 300 + cloudOffset) % (GAME_WIDTH + 200) - 100;
                const y = 100 + Math.sin(i) * 30;
                drawCloud(x, y, 60);
            }

            gameState.dayNightCycle += 0.0001;
            if (gameState.dayNightCycle > Math.PI * 2) {
                gameState.dayNightCycle = 0;
            }
        }

        function drawCloud(x, y, size) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.arc(x, y, size * 0.4, 0, Math.PI * 2);
            ctx.arc(x + size * 0.3, y, size * 0.5, 0, Math.PI * 2);
            ctx.arc(x + size * 0.6, y, size * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawUI() {
            ctx.save();

            // Health bar
            ctx.fillStyle = '#333';
            ctx.fillRect(10, 10, 150, 20);
            const healthPercent = player.health / player.maxHealth;
            ctx.fillStyle = healthPercent > 0.5 ? '#00ff00' : '#ff0000';
            ctx.fillRect(10, 10, 150 * healthPercent, 20);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(10, 10, 150, 20);

            // Coin counter
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`Coins: ${player.coins}`, 10, 50);
            ctx.fillText(`Stars: ${player.stars}`, 10, 75);
            ctx.fillText(`Level: ${gameState.currentLevel + 1}`, 10, 100);

            // Level name
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(levels[gameState.currentLevel].name, GAME_WIDTH / 2, 30);

            ctx.restore();
        }

        function drawPauseMenu() {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('PAUSED', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 50);

            ctx.font = 'bold 24px Arial';
            ctx.fillText('Press P to Resume', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 50);
            ctx.fillText('F for Fullscreen', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 100);

            ctx.restore();
        }

        function drawGameOverScreen() {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 50);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Arial';
            ctx.fillText(`Final Coins: ${player.coins}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 50);
            ctx.fillText('Press R to Restart', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 100);

            ctx.restore();

            if (keys['r'] || keys['R']) {
                keys['r'] = false;
                keys['R'] = false;
                initLevel(gameState.currentLevel);
                gameState.currentScene = 'game';
            }
        }

        function drawVictoryScreen() {
            ctx.save();
            const alpha = Math.min(1, gameState.victoryTimer / 1);
            ctx.globalAlpha = alpha;

            // Fireworks
            for (let i = 0; i < 50; i++) {
                const angle = (i / 50) * Math.PI * 2;
                const distance = 200 * Math.sin(gameState.victoryTimer * 5);
                const x = GAME_WIDTH / 2 + Math.cos(angle) * distance;
                const y = GAME_HEIGHT / 2 + Math.sin(angle) * distance;
                ctx.fillStyle = `hsl(${(i * 7) % 360}, 100%, 50%)`;
                ctx.fillRect(x, y, 4, 4);
            }

            ctx.globalAlpha = 1;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = '#ffff00';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('LEVEL COMPLETE!', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 50);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Arial';
            ctx.fillText(`Stars Collected: ${player.stars}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 50);
            ctx.fillText(`Total Coins: ${player.coins}`, GAME_WIDTH / 2, GAME_HEIGHT / 2 + 100);

            if (gameState.currentLevel < levels.length - 1) {
                ctx.fillText('Press SPACE for Next Level', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 150);
            } else {
                ctx.fillText('Press SPACE for Final Ending', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 150);
            }

            ctx.restore();

            if (keys[' ']) {
                keys[' '] = false;
                if (gameState.currentLevel < levels.length - 1) {
                    gameState.currentLevel++;
                    initLevel(gameState.currentLevel);
                    gameState.currentScene = 'game';
                } else {
                    gameState.currentScene = 'ending';
                    gameState.victoryTimer = 0;
                }
            }
        }

        function drawEndingScene() {
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Glowing book effect
            const bookGlow = Math.sin(gameState.timeElapsed * 3) * 50 + 100;
            ctx.shadowColor = 'rgba(255, 215, 0, 0.8)';
            ctx.shadowBlur = bookGlow;

            ctx.fillStyle = '#2c1810';
            ctx.fillRect(GAME_WIDTH / 2 - 200, GAME_HEIGHT / 2 - 250, 400, 500);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
            ctx.shadowBlur = 10;

            const messages = [
                "Every star collected...",
                "Every step taken...",
                "Every puzzle solved...",
                "was part of a little adventure",
                "created for someone truly special.",
                "",
                "If you are reading this...",
                "Thank you for being yourself.",
                "",
                "— From a friend who wanted",
                "to make you smile."
            ];

            let yOffset = GAME_HEIGHT / 2 - 200;
            messages.forEach((msg, idx) => {
                if (idx < Math.floor(gameState.victoryTimer * 2)) {
                    ctx.fillText(msg, GAME_WIDTH / 2, yOffset);
                    yOffset += 40;
                }
            });

            if (gameState.victoryTimer > 6) {
                // Draw the names with glowing particles
                ctx.font = 'bold 48px Arial';
                ctx.fillStyle = '#ff69b4';
                ctx.shadowColor = 'rgba(255, 105, 180, 0.8)';
                ctx.shadowBlur = 20;
                ctx.fillText('🌸 Chhipuu 🌸', GAME_WIDTH / 2, GAME_HEIGHT - 150);

                ctx.fillStyle = '#ffaa00';
                ctx.shadowColor = 'rgba(255, 170, 0, 0.8)';
                ctx.fillText('✨ Pagliiii ✨', GAME_WIDTH / 2, GAME_HEIGHT - 80);

                // Particles around names
                for (let i = 0; i < particles.length; i++) {
                    particles[i].draw();
                }
            }

            ctx.restore();

            if (keys[' ']) {
                keys[' '] = false;
                gameState.currentScene = 'mainMenu';
            }
        }

        function drawSplashScreen() {
            ctx.save();
            const progress = Math.min(gameState.timeElapsed * 2, 1);
            const grad = ctx.createLinearGradient(0, 0, GAME_WIDTH, GAME_HEIGHT);
            grad.addColorStop(0, `rgba(255, 105, 180, ${progress})`);
            grad.addColorStop(1, `rgba(100, 200, 255, ${progress})`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = `rgba(255, 255, 255, ${progress})`;
            ctx.font = `bold ${60 + progress * 40}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("Chhipuu's Secret Adventure", GAME_WIDTH / 2, GAME_HEIGHT / 2 - 50);

            ctx.font = `bold ${24 + progress * 20}px Arial`;
            ctx.fillText('A magical journey awaits...', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 50);

            if (gameState.timeElapsed > 3) {
                gameState.currentScene = 'mainMenu';
                gameState.timeElapsed = 0;
            }

            ctx.restore();
        }

        function drawMainMenu() {
            drawBackground();

            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.fillStyle = '#ffff00';
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#ff69b4';
            ctx.shadowBlur = 20;
            ctx.fillText("Chhipuu's Secret Adventure", GAME_WIDTH / 2, 100);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 28px Arial';
            ctx.shadowColor = 'rgba(255, 105, 180, 0.5)';
            ctx.shadowBlur = 10;

            const buttons = [
                { text: 'NEW GAME', y: 250 },
                { text: 'CONTINUE', y: 330 },
                { text: 'SETTINGS', y: 410 },
                { text: 'CREDITS', y: 490 }
            ];

            buttons.forEach((btn, idx) => {
                const isHovered = false;
                ctx.fillStyle = isHovered ? '#ffaa00' : '#fff';
                const boxWidth = 300;
                const boxHeight = 50;
                const x = GAME_WIDTH / 2 - boxWidth / 2;

                ctx.fillRect(x, btn.y - 25, boxWidth, boxHeight);
                ctx.fillStyle = '#000';
                ctx.fillText(btn.text, GAME_WIDTH / 2, btn.y);
            });

            ctx.restore();

            // Simple menu navigation
            if (keys['1']) {
                keys['1'] = false;
                gameState.currentLevel = 0;
                initLevel(0);
                gameState.currentScene = 'game';
            }
        }

        // ==================== LEVEL INITIALIZATION ====================
        function initLevel(levelIndex) {
            const levelData = levels[levelIndex];
            player = new Player(levelData.checkpointX, levelData.checkpointY);
            currentLevel = {
                platforms: levelData.platforms.map(p => new Platform(p.x, p.y, p.width, p.height, p.style, p.isMoving, p.moveDistance)),
                enemies: levelData.enemies.map(e => new Enemy(e.x, e.y, e.type, e.patrolDistance)),
                collectibles: levelData.collectibles.map(c => new Collectible(c.x, c.y, c.type))
            };
            particles = [];
            gameState.isPaused = false;
        }

        // ==================== MAIN GAME LOOP ====================
        function update(deltaTime) {
            if (gameState.isPaused) return;

            gameState.timeElapsed += deltaTime;

            if (gameState.currentScene === 'game') {
                // Player update
                player.update(deltaTime, currentLevel.platforms, currentLevel.enemies);

                // Platform updates
                currentLevel.platforms.forEach(p => p.update(deltaTime));

                // Enemy updates
                currentLevel.enemies.forEach(e => e.update(deltaTime));

                // Collectible updates and collisions
                currentLevel.collectibles.forEach(c => {
                    c.update(deltaTime);
                    if (!c.collected && c.checkCollision(player)) {
                        c.collected = true;
                        if (c.type === 'coin') {
                            player.coins++;
                            const emitter = new ParticleEmitter(c.x, c.y, 10, '#ffcc00');
                            particles.push(emitter);
                        } else if (c.type === 'star') {
                            player.stars++;
                            const emitter = new ParticleEmitter(c.x, c.y, 15, '#ffff00');
                            particles.push(emitter);
                        }
                    }
                });

                // Particle updates
                particles.forEach(emitter => emitter.update(deltaTime));
                particles = particles.filter(emitter => emitter.particles.length > 0);

                // Level complete check
                if (player.stars >= 4) {
                    gameState.currentScene = 'victory';
                    gameState.victoryTimer = 0;
                }

                // Game over check
                if (player.health <= 0) {
                    gameState.currentScene = 'gameOver';
                }
            } else if (gameState.currentScene === 'victory') {
                gameState.victoryTimer += deltaTime;
                
                // Add particles for the ending
                if (gameState.victoryTimer > 6 && gameState.victoryTimer < 8) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 150 + Math.random() * 100;
                    const x = GAME_WIDTH / 2 + Math.cos(angle) * distance;
                    const y = GAME_HEIGHT - 100 + Math.sin(angle) * distance;
                    const emitter = new ParticleEmitter(x, y, 1, ['#ff69b4', '#ffaa00'][Math.floor(Math.random() * 2)]);
                    particles.push(emitter);
                }

                particles.forEach(emitter => emitter.update(deltaTime));
                particles = particles.filter(emitter => emitter.particles.length > 0);
            } else if (gameState.currentScene === 'ending') {
                gameState.victoryTimer += deltaTime;
                
                // Add glowing particles around names
                if (Math.random() < 0.3) {
                    const x = GAME_WIDTH / 2 + (Math.random() - 0.5) * 400;
                    const y = GAME_HEIGHT - 100 + (Math.random() - 0.5) * 100;
                    const colors = ['#ff69b4', '#ffaa00', '#ffff00', '#ff1493'];
                    const emitter = new ParticleEmitter(x, y, 2, colors[Math.floor(Math.random() * colors.length)]);
                    particles.push(emitter);
                }

                particles.forEach(emitter => emitter.update(deltaTime));
                particles = particles.filter(emitter => emitter.particles.length > 0);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            if (gameState.currentScene === 'splash') {
                drawSplashScreen();
            } else if (gameState.currentScene === 'mainMenu') {
                drawMainMenu();
            } else if (gameState.currentScene === 'game') {
                drawBackground();

                // Draw game objects
                currentLevel.platforms.forEach(p => p.draw());
                currentLevel.enemies.forEach(e => e.draw());
                currentLevel.collectibles.forEach(c => {
                    if (!c.collected) c.draw();
                });

                // Draw particles
                particles.forEach(emitter => emitter.draw());

                // Draw player
                player.draw();

                // Draw UI
                drawUI();

                if (gameState.isPaused) {
                    drawPauseMenu();
                }
            } else if (gameState.currentScene === 'gameOver') {
                drawGameOverScreen();
            } else if (gameState.currentScene === 'victory') {
                drawVictoryScreen();
            } else if (gameState.currentScene === 'ending') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.95)';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
                drawEndingScene();
            }
        }

        function gameLoop() {
            const currentTime = Date.now();
            const deltaTime = Math.min((currentTime - lastFrameTime) / 1000, 0.016);
            lastFrameTime = currentTime;

            update(deltaTime);
            draw();

            requestAnimationFrame(gameLoop);
        }

        // ==================== INITIALIZATION ====================
        initLevel(0);
        gameState.currentScene = 'splash';
        gameState.timeElapsed = 0;
        gameLoop();

        // Prevent context menu on right click
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
</body>
</html>
